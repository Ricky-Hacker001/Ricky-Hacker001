name: Update GitHub Profile Assets

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

jobs:
  update-profile-assets:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout profile repository
        uses: actions/checkout@v4

      - name: Generate contribution snake
        uses: Platane/snk@v3
        with:
          github_user_name: Ricky-Hacker001
          outputs: |
            profile/github-snake.svg
            profile/github-snake-dark.svg?palette=github-dark

      - name: Generate local GitHub stats
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
          from collections import Counter

          USER = "Ricky-Hacker001"
          TOKEN = os.environ["GH_TOKEN"]
          HEADERS = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {TOKEN}",
              "X-GitHub-Api-Version": "2022-11-28",
          }

          def get(url):
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req) as response:
                  return json.load(response)

          user = get(f"https://api.github.com/users/{USER}")
          repos = get(f"https://api.github.com/users/{USER}/repos?per_page=100&sort=updated")

          public_repos = user.get("public_repos", 0)
          followers = user.get("followers", 0)
          following = user.get("following", 0)
          stars = sum(r.get("stargazers_count", 0) for r in repos)

          languages = Counter()

          for repo in repos:
              if repo.get("fork"):
                  continue
              try:
                  data = get(repo["languages_url"])
                  for language, amount in data.items():
                      languages[language] += amount
              except Exception:
                  pass

          total = sum(languages.values()) or 1
          top = languages.most_common(6)

          os.makedirs("profile", exist_ok=True)

          def esc(value):
              return str(value).replace("&", "&amp;").replace("<", "&lt;").replace(">", "&gt;")

          stats_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260">
            <rect width="760" height="260" rx="14" fill="#1a1b27"/>
            <text x="32" y="42" fill="#70a5fd" font-family="Arial,sans-serif" font-size="24" font-weight="700">Ricky's GitHub Activity</text>
            <text x="32" y="78" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="14">Public profile statistics</text>
            <text x="42" y="130" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="700">{public_repos}</text>
            <text x="42" y="154" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="14">Repositories</text>
            <text x="230" y="130" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="700">{followers}</text>
            <text x="230" y="154" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="14">Followers</text>
            <text x="418" y="130" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="700">{stars}</text>
            <text x="418" y="154" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="14">Repository Stars</text>
            <text x="606" y="130" fill="#ffffff" font-family="Arial,sans-serif" font-size="30" font-weight="700">{following}</text>
            <text x="606" y="154" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="14">Following</text>
            <line x1="32" y1="190" x2="728" y2="190" stroke="#3b3f51"/>
            <text x="32" y="220" fill="#70a5fd" font-family="Arial,sans-serif" font-size="14">Generated automatically with GitHub Actions</text>
          </svg>'''

          with open("profile/github-stats.svg", "w", encoding="utf-8") as f:
              f.write(stats_svg)

          bars = []
          y = 48
          for language, amount in top:
              pct = amount / total * 100
              bars.append(
                  f'<text x="28" y="{y}" fill="#ffffff" font-family="Arial,sans-serif" font-size="14">{esc(language)}</text>'
                  f'<text x="680" y="{y}" text-anchor="end" fill="#a9b1d6" font-family="Arial,sans-serif" font-size="14">{pct:.1f}%</text>'
                  f'<rect x="28" y="{y+10}" width="650" height="8" rx="4" fill="#2f3349"/>'
                  f'<rect x="28" y="{y+10}" width="{max(4, 650*pct/100):.1f}" height="8" rx="4" fill="#70a5fd"/>'
              )
              y += 58

          langs_svg = f'''<svg xmlns="http://www.w3.org/2000/svg" width="760" height="420" viewBox="0 0 760 420">
            <rect width="760" height="420" rx="14" fill="#1a1b27"/>
            <text x="28" y="30" fill="#70a5fd" font-family="Arial,sans-serif" font-size="24" font-weight="700">Top Languages</text>
            {''.join(bars)}
          </svg>'''

          with open("profile/top-languages.svg", "w", encoding="utf-8") as f:
              f.write(langs_svg)
          PY

      - name: Commit generated profile assets
        uses: EndBug/add-and-commit@v9
        with:
          add: "profile/*.svg"
          message: "chore: update GitHub profile assets"
          default_author: github_actions
