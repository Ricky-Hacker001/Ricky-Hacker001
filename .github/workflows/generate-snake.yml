name: Generate Snake Animation 🐍

on:
  schedule:
    - cron: "0 0 * * *" # every day at midnight
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Generate GitHub contribution snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: Ricky-Hacker001
          svg_out_path: output/github-contribution-grid-snake.svg

      - name: Commit and push SVG
        uses: EndBug/add-and-commit@v9
        with:
          author_name: github-actions
          author_email: github-actions@github.com
          message: "🐍 Update GitHub contribution snake"
          add: "output/github-contribution-grid-snake.svg"
